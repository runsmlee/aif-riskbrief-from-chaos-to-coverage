<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RiskBrief — From Chaos to Coverage. Simplify your insurance journey with personalized risk assessment and coverage recommendations." />
    <meta name="theme-color" content="#EF4444" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:title" content="RiskBrief — From Chaos to Coverage" />
    <meta property="og:description" content="Get personalized insurance coverage recommendations based on your unique risk profile in minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RiskBrief" />
    <meta property="og:url" content="https://riskbrief.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RiskBrief — From Chaos to Coverage" />
    <meta name="twitter:description" content="Get personalized insurance coverage recommendations based on your unique risk profile in minutes." />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://riskbrief.app" />

    <title>RiskBrief — From Chaos to Coverage</title>

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "RiskBrief",
      "description": "Insurance risk assessment and coverage recommendation tool",
      "url": "https://riskbrief.app",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Inline critical styles for instant first paint -->
    <style>
      /* Prevent flash of unstyled content and handle dark mode immediately */
      html {
        background-color: #ffffff;
        color: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background-color: #0f172a;
          color: #f1f5f9;
        }
      }
      [data-theme="dark"] html,
      [data-theme="dark"] {
        background-color: #0f172a;
        color: #f1f5f9;
      }
      /* Inline skeleton for instant perceived load */
      #root:not(:empty) + .initial-loader { display: none; }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        gap: 16px;
      }
      .initial-loader__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #ef4444;
        border-radius: 50%;
        animation: il-spin 0.8s linear infinite;
      }
      @keyframes il-spin {
        to { transform: rotate(360deg); }
      }
      .initial-loader__text {
        color: #6b7280;
        font-size: 14px;
      }
    </style>

    <!-- Inline dark mode detection to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('riskbrief-theme');
          if (stored === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (stored === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="initial-loader" aria-hidden="true">
      <div class="initial-loader__spinner"></div>
      <p class="initial-loader__text">Loading RiskBrief...</p>
    </div>
    <noscript>
      <div style="max-width:600px;margin:40px auto;padding:20px;text-align:center;font-family:system-ui,sans-serif;color:#1f2937;">
        <h1 style="font-size:24px;margin-bottom:16px;">RiskBrief — From Chaos to Coverage</h1>
        <p style="font-size:16px;color:#6b7280;">RiskBrief requires JavaScript to run. Please enable JavaScript in your browser settings to use the risk assessment tool.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
